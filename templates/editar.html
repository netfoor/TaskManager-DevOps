<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar tarea - TaskManager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="contenedor">
      <header class="cabecera">
        <h1>Editar tarea</h1>
        <p>Actualiza la información de la tarea seleccionada.</p>
      </header>

      {% with avisos = get_flashed_messages(with_categories=true) %}
        {% if avisos %}
          <div class="avisos" aria-live="polite">
            {% for categoria, mensaje in avisos %}
              <p class="aviso{{ ' aviso--error' if categoria == 'error' else '' }}">{{ mensaje }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <section class="panel">
        <form class="formulario" method="post" action="{{ url_for('edicion.editar_tarea', identificador=tarea.id) }}">
          <label>
            Nombre
            <input type="text" name="nombre" value="{{ tarea.nombre }}" maxlength="120" required>
          </label>
          <label>
            Descripción
            <textarea name="descripcion" maxlength="500">{{ tarea.descripcion }}</textarea>
          </label>
          <label>
            Prioridad
            <select name="prioridad">
              {% for prioridad in prioridades %}
                <option value="{{ prioridad }}"{% if prioridad == tarea.prioridad %} selected{% endif %}>{{ prioridad }}</option>
              {% endfor %}
            </select>
          </label>
          <div>
            <button type="submit">Guardar cambios</button>
            <a class="boton segundo" href="{{ url_for('indice') }}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
